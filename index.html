<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Code Messenger</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app-shell">
  <header class="topbar"><div class="traffic"><i class="red"></i><i class="yellow"></i><i class="green"></i></div><div class="nav">‹ <span>›</span></div><div class="search">Search</div><div class="top-actions">⌘　▾　▥　▤　▱</div></header>
  <div class="main-layout">
    <aside class="activity"><button class="activity-btn active" title="Чат">▣<b>2</b></button><button class="activity-btn" title="Поиск">⌕</button><button class="activity-btn" title="Настройки">⚙</button></aside>
    <main class="workspace">
      <section class="pane" data-user="me"><div class="tab"><span class="file-icon">◉</span><strong>Вы</strong><span class="close">×</span></div><div class="messages" aria-live="polite"><div class="empty">Начните диалог<br><small>Сообщения появятся здесь</small></div></div><form class="composer"><button type="button" class="attach" aria-label="Прикрепить файл">＋</button><textarea aria-label="Сообщение для вас" placeholder="Написать сообщение..." rows="1"></textarea><button class="send" aria-label="Отправить">➤</button><input class="file-input" type="file" accept=".py,.cpp" hidden></form></section>
      <div class="splitter" aria-hidden="true"></div>
      <section class="pane" data-user="companion"><div class="tab"><span class="file-icon cpp">◉</span><strong>Собеседник</strong><span class="close">×</span></div><div class="messages" aria-live="polite"><div class="empty">Ожидание сообщения<br><small>Ответ собеседника появится здесь</small></div></div><form class="composer"><button type="button" class="attach" aria-label="Прикрепить файл">＋</button><textarea aria-label="Сообщение собеседника" placeholder="Написать сообщение..." rows="1"></textarea><button class="send" aria-label="Отправить">➤</button><input class="file-input" type="file" accept=".py,.cpp" hidden></form></section>
    </main>
  </div>
  <footer class="statusbar"><span>⌁</span><span>0 ошибок</span><span>⌁ 0 предупреждений</span><span class="status-spacer"></span><span>Ln 1, Col 1</span><span>Spaces: 4</span><span>UTF-8</span><span>LF</span><span>Code Messenger</span></footer>
</div><div class="toast" role="status"></div><script src="app.js"></script>
</body></html>
